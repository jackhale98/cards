name: CI

# Cloudflare Pages builds and deploys lamplight.cards from main (and a preview for every
# branch); this workflow just type-checks, tests and builds every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (the pnpm version comes from packageManager in package.json)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # every game dealt in a real browser at phone, laptop and TV sizes (see e2e/layout.spec.ts)
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (the pnpm version comes from packageManager in package.json)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # bots play bridge and Hold'em, and other people's programs check the records: endplay (bridge,
  # with a double-dummy solver) and PokerKit replay every deal and hand (see tools/README.md)
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # (the pnpm version comes from packageManager in package.json)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r tools/requirements.txt
      - run: pnpm records
        env:
          DEALS: 3
          HANDS: 20
      - run: python tools/check_records.py records
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: records
          path: records
          retention-days: 7

  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      # (the pnpm version comes from packageManager in package.json)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # the real relay code, run locally, put through its paces (see smoke.mjs)
      - name: Smoke test
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ && break; sleep 1; done
          node smoke.mjs || (cat wrangler.log; exit 1)
