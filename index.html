<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b2a21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Play cards together on your phones. Your phone is your hand — no accounts, no app, no server." />

    <meta name="apple-mobile-web-app-title" content="Lamplight" />

    <title>Lamplight</title>
    <style>
      /* The Lamplight loader (ui/components/Loader.svelte draws the same thing in the app): one card
         floats up under the lamp, turns over to show the ace of spades, turns back, and comes up as
         the king, queen and jack on the next turns, the home screen's hand. Each turn ends face down
         where it began, and the face changes only while the back is showing, so the loop never jumps.
         The back is the table's own (--back-art, set by ui/looks.ts). */
      .lc {
        position: relative;
        display: inline-block;
        flex: none;
        width: var(--lc-w, 56px);
        height: calc(var(--lc-w, 56px) * 1.4);
        font-size: calc(var(--lc-w, 56px) / 5);
        perspective: calc(var(--lc-w, 56px) * 6);
        vertical-align: middle;
      }
      .lc-glow {
        position: absolute;
        inset: -55% -90%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 200, 110, 0.34), rgba(255, 200, 110, 0));
        animation: lc-glow 1.8s ease-in-out infinite;
      }
      .lc-shadow {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: -14%;
        height: 12%;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0));
        animation: lc-shadow 1.8s ease-in-out infinite;
      }
      .lc-float,
      .lc-card {
        position: absolute;
        inset: 0;
      }
      .lc-float {
        animation: lc-float 1.8s ease-in-out infinite;
      }
      .lc-card {
        transform-style: preserve-3d;
        animation: lc-flip 1.8s cubic-bezier(0.55, 0, 0.3, 1) infinite;
      }
      .lc-back,
      .lc-front {
        position: absolute;
        inset: 0;
        border-radius: 0.6em;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        box-shadow:
          0 0.08em 0.25em rgba(0, 0, 0, 0.3),
          inset 0 0 0 1px #e7e0d0;
      }
      .lc-back {
        background:
          var(--back-art, none) center / 100% 100% no-repeat,
          var(--back-a, #1f3356);
      }
      .lc-front {
        transform: rotateY(180deg);
        background: linear-gradient(160deg, #fff 0%, #fbf8f1 60%, #f1ebdd 100%);
      }
      .lc-strip {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 400%;
        display: flex;
        flex-direction: column;
        animation: lc-faces 7.2s step-end infinite;
      }
      .lc-face {
        position: relative;
        flex: 1;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      .lc-face svg {
        fill: currentColor;
      }
      .lc-corner {
        position: absolute;
        top: 0.3em;
        left: 0.22em;
        width: 1.2em;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-weight: 700;
        font-size: 1.25em;
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      .lc-corner svg {
        width: 0.72em;
        height: 0.72em;
        margin-top: 0.08em;
      }
      .lc-corner.lc-end {
        top: auto;
        left: auto;
        bottom: 0.3em;
        right: 0.22em;
        transform: rotate(180deg);
      }
      .lc-ace {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.6em;
        height: 2.6em;
        transform: translate(-50%, -50%);
      }
      .lc-court {
        position: absolute;
        inset: 18% 22%;
        border: 1px solid;
        border-radius: 0.14em;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.15em;
        background: linear-gradient(180deg, rgba(233, 196, 106, 0.2), rgba(233, 196, 106, 0.05));
      }
      .lc-court i {
        font-weight: 700;
        font-size: 2.1em;
        line-height: 1;
      }
      .lc-court svg {
        width: 1em;
        height: 1em;
      }
      /* tiny: only the big suit, which is all that reads at that size */
      .lc-small .lc-corner,
      .lc-small .lc-court i {
        display: none;
      }
      .lc-small .lc-court {
        border: 0;
        background: none;
      }
      .lc-small .lc-court svg,
      .lc-small .lc-ace {
        width: 3em;
        height: 3em;
      }
      @keyframes lc-flip {
        0%,
        12% {
          transform: rotateY(0deg);
        }
        38%,
        70% {
          transform: rotateY(180deg);
        }
        96%,
        100% {
          transform: rotateY(360deg);
        }
      }
      @keyframes lc-float {
        0%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-14%);
        }
        54% {
          transform: translateY(-9%);
        }
        80% {
          transform: translateY(-12%);
        }
      }
      @keyframes lc-shadow {
        0%,
        100% {
          opacity: 1;
          transform: scaleX(1);
        }
        30%,
        80% {
          opacity: 0.45;
          transform: scaleX(0.8);
        }
      }
      @keyframes lc-glow {
        0%,
        100% {
          opacity: 0.6;
        }
        45%,
        65% {
          opacity: 1;
        }
      }
      /* a new face each turn, swapped at the start of the turn while the back is showing */
      @keyframes lc-faces {
        0% {
          transform: translateY(0);
        }
        25% {
          transform: translateY(-25%);
        }
        50% {
          transform: translateY(-50%);
        }
        75% {
          transform: translateY(-75%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .lc-glow,
        .lc-shadow,
        .lc-float,
        .lc-card,
        .lc-strip {
          animation: none;
        }
      }

      /* the first screen, while the app itself downloads (main.ts fades it out) */
      .lc-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 34px;
        background:
          radial-gradient(ellipse 85% 60% at -6% -6%, rgba(255, 196, 118, 0.42), rgba(255, 186, 104, 0) 70%),
          radial-gradient(ellipse 80% 70% at 50% 42%, #2f5e3e 0%, #1b3b28 55%, #0d1a10 100%);
        transition: opacity 0.35s ease;
      }
      .lc-splash.lc-gone {
        opacity: 0;
        pointer-events: none;
      }
      .lc-word {
        font:
          400 32px 'Iowan Old Style',
          'Palatino Linotype',
          Palatino,
          Georgia,
          serif;
        color: #fbe7b2;
        text-shadow: 0 0 24px rgba(255, 200, 110, 0.35);
      }
    </style>
